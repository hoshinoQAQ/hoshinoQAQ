<svg width="1200" height="520" viewBox="0 0 1200 520" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <clipPath id="card">
      <rect width="1200" height="520" rx="28"/>
    </clipPath>
    <linearGradient id="wash" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3f5f93" stop-opacity=".18"/>
      <stop offset=".55" stop-color="#3b2a5b" stop-opacity=".08"/>
      <stop offset="1" stop-color="#1d1a2f" stop-opacity=".48"/>
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#243552" flood-opacity=".22"/>
    </filter>
    <style>
      .title{font:900 70px Georgia,serif;fill:#ffffff}
      .sub{font:700 34px "Segoe Script",cursive;fill:#ffd7e9}
      .body{font:700 22px "Segoe UI",Arial,sans-serif;fill:#f8faff}
      .small{font:700 16px "Segoe UI",Arial,sans-serif;fill:#59627d}
      .mini{font:800 16px "Segoe UI",Arial,sans-serif;fill:#ff72b4}
      .chip{font:700 18px "Segoe UI",Arial,sans-serif;fill:#435276}
    </style>
  </defs>
  <g clip-path="url(#card)">
    <image href="source-parts/spring_breeze_over_a_dreamy_cityscape.png" x="0" y="-110" width="1200" height="760" preserveAspectRatio="xMidYMid slice"/>
    <rect width="1200" height="520" fill="url(#wash)"/>
    <rect x="0" y="356" width="1200" height="164" fill="#fff8fd" fill-opacity=".28"/>
    <rect x="138" y="145" width="452" height="186" rx="28" fill="#ffffff" fill-opacity=".22" stroke="#ffd9ea" stroke-opacity=".9"/>
    <text class="title" x="156" y="212">小鸟游星野</text>
    <text class="sub" x="162" y="262">Takanashi Hoshino</text>
    <text class="body" x="156" y="316">温柔而坚定，像星光一样照亮代码的世界。</text>
    <g transform="translate(156 368)">
      <rect width="390" height="64" rx="22" fill="#ffffff" fill-opacity=".78" stroke="#ffd9ea"/>
      <text class="chip" x="34" y="41">前端开发 · 开源爱好者 · 继续慢慢变强</text>
    </g>
    <g transform="translate(846 184)" filter="url(#shadow)">
      <rect width="286" height="160" rx="24" fill="#fff9fd" fill-opacity=".84" stroke="#ffd4e7"/>
      <text class="mini" x="24" y="34">正在播放 ♪</text>
      <text class="small" x="24" y="62">星野的午后咖啡馆</text>
      <text class="small" x="24" y="86">lofi hip-pop / chill</text>
      <rect x="24" y="110" width="150" height="8" rx="4" fill="#f0dae7"/>
      <rect x="24" y="110" width="92" height="8" rx="4" fill="#ff86bf"/>
      <text class="small" x="24" y="136">01:12 / 03:45</text>
      <image href="source-parts/pastel_spring_day_on_the_rooftop.png" x="188" y="22" width="78" height="98" preserveAspectRatio="xMidYMid slice"/>
    </g>
  </g>
</svg>
