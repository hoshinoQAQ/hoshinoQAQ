<svg width="780" height="360" viewBox="0 0 780 360" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <clipPath id="card">
      <rect width="780" height="360" rx="28"/>
    </clipPath>
    <linearGradient id="overlay" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".14"/>
      <stop offset=".5" stop-color="#403357" stop-opacity=".12"/>
      <stop offset="1" stop-color="#231f38" stop-opacity=".52"/>
    </linearGradient>
    <style>
      .tag{font:800 16px "Segoe UI",Arial,sans-serif;fill:#ff78b8}
      .title{font:900 30px "Segoe UI",Arial,sans-serif;fill:#26304f}
      .body{font:700 22px "Segoe UI",Arial,sans-serif;fill:#4d5878}
      .sign{font:800 16px "Segoe UI",Arial,sans-serif;fill:#ff72b4}
    </style>
  </defs>
  <g clip-path="url(#card)">
    <image href="source-parts/sleeping_chibi_girl_on_a_cloud.png" x="0" y="-40" width="780" height="430" preserveAspectRatio="xMidYMid slice"/>
    <rect width="780" height="360" fill="url(#overlay)"/>
    <g transform="translate(34 34)">
      <rect width="332" height="292" rx="26" fill="#fffafb" fill-opacity=".82" stroke="#ffd7ea"/>
      <text class="tag" x="24" y="36">Today's Quote</text>
      <text class="title" x="24" y="76">今日留言</text>
      <text class="body" x="24" y="138">努力不一定会有回报，</text>
      <text class="body" x="24" y="176">但不努力的话，</text>
      <text class="body" x="24" y="214">就一定不会有回报了！</text>
      <text class="sign" x="24" y="256">— 小鸟游星野</text>
    </g>
  </g>
</svg>
