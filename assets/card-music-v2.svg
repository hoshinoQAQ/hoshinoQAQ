<svg width="780" height="360" viewBox="0 0 780 360" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <clipPath id="card">
      <rect width="780" height="360" rx="28"/>
    </clipPath>
    <linearGradient id="overlay" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fdf8ff" stop-opacity=".12"/>
      <stop offset=".55" stop-color="#372954" stop-opacity=".14"/>
      <stop offset="1" stop-color="#1f2137" stop-opacity=".56"/>
    </linearGradient>
    <style>
      .tag{font:800 16px "Segoe UI",Arial,sans-serif;fill:#ff78b8}
      .title{font:900 30px "Segoe UI",Arial,sans-serif;fill:#ffffff}
      .body{font:700 18px "Segoe UI",Arial,sans-serif;fill:#f3f7ff}
      .small{font:700 15px "Segoe UI",Arial,sans-serif;fill:#475476}
    </style>
  </defs>
  <g clip-path="url(#card)">
    <image href="source-parts/dreamy_nap_with_a_peaceful_companion.png" x="0" y="-48" width="780" height="456" preserveAspectRatio="xMidYMid slice"/>
    <rect width="780" height="360" fill="url(#overlay)"/>
    <g transform="translate(36 210)">
      <rect width="708" height="114" rx="24" fill="#fffafc" fill-opacity=".8" stroke="#ffd9ea"/>
      <text class="tag" x="24" y="32">Now Playing ♪</text>
      <text class="title" x="24" y="68" fill="#26304f">夜空与代码之间</text>
      <text class="small" x="24" y="94">慢一点没关系，把每个部分做好就行。</text>
      <rect x="430" y="32" width="174" height="8" rx="4" fill="#f0dae7"/>
      <rect x="430" y="32" width="104" height="8" rx="4" fill="#ff86bf"/>
      <text class="small" x="430" y="62">01:12 / 03:45</text>
    </g>
  </g>
</svg>
