<svg width="780" height="360" viewBox="0 0 780 360" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <clipPath id="card">
      <rect width="780" height="360" rx="28"/>
    </clipPath>
    <linearGradient id="overlay" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff7fc" stop-opacity=".08"/>
      <stop offset=".58" stop-color="#2f2748" stop-opacity=".12"/>
      <stop offset="1" stop-color="#1c1e33" stop-opacity=".52"/>
    </linearGradient>
    <style>
      .tag{font:800 16px "Segoe UI",Arial,sans-serif;fill:#ff78b8}
      .title{font:900 30px "Segoe UI",Arial,sans-serif;fill:#ffffff}
      .body{font:700 18px "Segoe UI",Arial,sans-serif;fill:#f4f8ff}
    </style>
  </defs>
  <g clip-path="url(#card)">
    <image href="source-parts/pastel_sakura_study_space_with_charm.png" x="0" y="-26" width="780" height="460" preserveAspectRatio="xMidYMid slice"/>
    <rect width="780" height="360" fill="url(#overlay)"/>
    <rect x="32" y="222" width="716" height="108" rx="24" fill="#1d2540" fill-opacity=".48" stroke="#ffd7ea" stroke-opacity=".85"/>
    <text class="tag" x="58" y="258">Focus</text>
    <text class="title" x="58" y="292">继续整理前端和工具类方向的项目</text>
    <text class="body" x="58" y="320">把零散的想法做成更完整、更稳定的作品。</text>
  </g>
</svg>
